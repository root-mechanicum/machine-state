# The 27B's user service, started by hand (no [Install]); Strata IQ3_S is the login default since
# 2026-11-10. It conflicts with vllm-qwen38 and the Strata units, so starting one stops the other.
# Projection does not start or enable it.
[[target]]
kind = "render"
path = "~/.config/systemd/user/llama-twin-turbo.service"
sources = ["canonical/llama-cpp/llama-twin-turbo.service"]
