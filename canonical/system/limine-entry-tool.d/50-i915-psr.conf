# Intel panel self-refresh off (machine-state-2eg, 2026-11-12).
# linux-cachyos 7.3.3 booted to a black screen with only a cursor on this
# laptop's built-in panel; with this option it works. Costs some battery while
# the screen is still. Applies to every limine entry, LTS included (harmless).
#
# Temporary: canonical/interests/kernel-psr-retest.toml alerts when a newer
# kernel is installed. If that kernel works without it, remove this file from
# /etc/limine-entry-tool.d/ and run `sudo limine-update`.
#
# Installed by hand (system config, not projected):
#   sudo install -Dm644 canonical/system/limine-entry-tool.d/50-i915-psr.conf \
#        /etc/limine-entry-tool.d/50-i915-psr.conf
#   sudo limine-update
KERNEL_CMDLINE[default]+=i915.enable_psr=0
