# System config, not projected: install by hand, as root, with
#   sudo install -Dm644 canonical/system/logind.conf.d/50-model-sleep.conf \
#     /etc/systemd/logind.conf.d/50-model-sleep.conf
#   sudo systemctl kill -s HUP systemd-logind
# How long logind waits for delay inhibitors before sleeping (default 5 s). model-sleep-guard
# needs room for Strata's TimeoutStopSec=120 plus the wait for the GPU to empty. Sleep waits only
# as long as the guard needs; this is the ceiling, after which logind sleeps regardless.
[Login]
InhibitDelayMaxSec=180
