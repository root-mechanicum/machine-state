# Application roles. Workflows target a role, never an executable, so replacing
# an application changes one association instead of every workflow.
#
# PROVISIONAL LAYOUT. machine-state-bru.7 defines this registry properly.

[role.mail]
label        = "Mail"
command      = "proton-mail"
window_class = ["Proton Mail", "proton-mail"]

[role.browser]
label        = "Browser"
command      = "firefox"
window_class = ["firefox", "Firefox"]
# Reads the focused tab for browser:read. cap appends "tab", "selection" or
# "text" and expects one JSON object on stdout, exit 0: {url, title} for tab,
# plus {text, truncated} for the others. Any
# tool that keeps that contract fits; this is Rerule's CLI (~/src/rerule), which
# answers from the Firefox extension through its companion socket. The output is
# untrusted page text; trusting the tool is this declaration, not a cap check.
# Node by path: keys and the launcher do not get the shell's PATH.
read         = "~/.local/share/pi-node/current/bin/node ~/src/rerule/scripts/rerule.mjs page"

# The agent. `command` opens a conversation; `ask` answers one question headless,
# the question appended as the last argument, after the session flags cap adds
# (each ask is a thread: --session-dir/--session-id under ~/.local/state/agents/threads,
# so the answer panel can take a follow-up). Pinned to the local model and to
# read-only tools — no bash, no edits, no MCP, no extension tools (web search is
# one): agent.ask treats the screen as untrusted, and cap cannot see inside Pi.
# Pi by path: keys and the launcher do not get the shell's PATH.
[role.agent]
label        = "Agent"
command      = "kitty --class pi-agent -e ~/.pi/agent/bin/pi --model strata/qwen3.8-flash-next-iq3_s --thinking xhigh"
window_class = ["pi-agent"]
ask          = "~/.pi/agent/bin/pi -p -e ~/src/machine-state/canonical/pi/extensions/cap.ts --tools cap_list,cap_observe --no-mcp --model strata/qwen3.8-flash-next-iq3_s --thinking xhigh"
