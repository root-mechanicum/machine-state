# Event bindings: event -> action. Declared, never discovered — an event with no
# binding here is recorded and nothing runs.
#
# One event, many responses: each binding is one response, run in the order
# written, independently. A binding authorises nothing by itself; a root-owned
# grant in /etc/machine-state/grants.toml must name it too (see bin/cap).

# The home backup, first: the responses share the unit's time limit, and a slow
# digest must not be what stops a backup. maintain-class, so it runs only if
# [maintain] in the grants names it and its repository (canonical/actions/backup.toml).
[[event_binding]]
event  = "time.daily"
action = "backup.home"

[[event_binding]]
event  = "time.daily"
action = "journal.errors.notify"

[[event_binding]]
event  = "time.daily"
action = "journal.digest"

# Every interest's sources, hourly. What to follow lives in canonical/interests/,
# so a new interest needs no binding here.
[[event_binding]]
event  = "time.hourly"
action = "interests.fetch"

# Installed package versions, hourly, so a reminder about a new kernel arrives
# before the restart that boots it. Local only.
[[event_binding]]
event  = "time.hourly"
action = "interests.packages"

# Mail from the senders interests declare, read-only through the local Bridge,
# then the morning digest written by the local model (canonical/tooling/proton-bridge.md).
[[event_binding]]
event  = "time.daily"
action = "interests.mail"

[[event_binding]]
event  = "time.daily"
action = "interests.digest"

# Whether the daily backup actually happened, on the hourly timer: a daily run
# that never fired cannot say so itself. Quiet unless the newest snapshot is over
# 36 hours old, and then at most once a day.
[[event_binding]]
event  = "time.hourly"
action = "backup.freshness"
