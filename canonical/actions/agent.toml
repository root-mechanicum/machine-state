# The agent as a capability: whatever role.agent names answers. A key, a launcher
# and another agent all reach it by this name, never by the agent's executable.

# Asked by a person, answered later. Reads the screen (untrusted titles) and,
# when the browser has focus, its page via role.browser.read (untrusted text), so no
# net: channel; the answer goes to a notification and an inbox note. Each ask is a
# thread: a follow-up typed in the answer panel continues it, same agent, same limits.
[action."agent.ask"]
implementation = "agent.ask"
label       = "Ask the agent a quick question about what is on screen"
category    = "Agent"
args        = { prompt = "the question", thread = "continue this thread (the id in its note); omit to start one" }
mutating    = false
consequence = "report"
channels    = ["desktop:read", "browser:read", "model:local", "notify", "inbox"]

# A conversation about a notification, from the hub: the notification is the
# first turn, found by its id in Noctalia's history (untrusted text), and the
# agent is asked nothing until the person writes. Then it is agent.ask's thread,
# same agent, same limits.
[action."agent.discuss"]
implementation = "agent.discuss"
label       = "Talk about a notification"
category    = "Agent"
args        = { notification = "its id in Noctalia's history (cap notifications)" }
mutating    = false
consequence = "report"
channels    = ["notifications:read", "inbox", "notify"]

# The quick-ask box: the launcher, opened in /ask mode (canonical/noctalia/plugins/ask).
# Opening it changes nothing but the screen; the question is a separate act.
[action."agent.summon"]
implementation = "agent.summon"
label       = "Open the quick-ask box"
category    = "Agent"
mutating    = true
consequence = "adjust"

# Words to one invocation, for a person to look at and run (/do's "work it
# out"). Translates only: the answer is printed, nothing is run.
[action."agent.resolve"]
implementation = "agent.resolve"
label       = "Work out which action a request means"
category    = "Agent"
args        = { text = "the request, in words" }
mutating    = false
consequence = "observe"
# Who and what is in front of the person (window, browser tab), so "this" means
# something; never page content, because the resolver picks what runs.
channels    = ["desktop:read", "browser:read", "model:local"]
