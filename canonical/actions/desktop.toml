# Semantic actions. A key, a menu, an agent and an event binding all name the
# same action. An action never embeds an opaque shell command.

[action."desktop.application.ensure"]
implementation = "desktop.application.ensure"
label       = "Open or focus an application"
category    = "Applications"
args        = { role = "role name" }
mutating    = true
consequence = "adjust"
# ensure, not open and not focus: those disagree exactly when the application is
# not running. The proposal states which branch it will take.

# Deliberately has NO key binding. The registries are separate objects, so an
# action must be fully usable by an agent while absent from the key surface. If
# it cannot exist without a chord, the separation is nominal.
[action."desktop.window.list"]
implementation = "desktop.window.list"
label       = "List open windows"
category    = "Desktop"
args        = { role = "optional role name" }
mutating    = false
consequence = "observe"

# Declared ahead of its implementation on purpose: the catalogue must show it as
# unimplemented rather than pretending it works or hiding it.
[action."desktop.workspace.arrange"]
implementation = "desktop.workspace.arrange"
label          = "Arrange a workspace"
category       = "Desktop"
mutating       = true
consequence    = "adjust"

# Window actions name their window by address; left out, it is the focused
# window, resolved before anything is dispatched. Both read the result back.
[action."desktop.window.float"]
implementation = "desktop.window.float"
label       = "Float or tile a window"
category    = "Desktop"
args        = { floating = "yes or no", window = "optional window address; default the focused window" }
mutating    = true
consequence = "adjust"

[action."desktop.window.move"]
implementation = "desktop.window.move"
label       = "Move a window to a workspace"
category    = "Desktop"
args        = { workspace = "workspace name or number", window = "optional window address; default the focused window" }
mutating    = true
consequence = "adjust"

# commit, not adjust: typed into a terminal, text is a command. From a person
# it is what they asked for; from anything else it waits for approval.
[action."desktop.text.insert"]
implementation = "desktop.text.insert"
label       = "Type text into the focused window"
category    = "Desktop"
args        = { text = "the text to type" }
mutating    = true
consequence = "commit"
