# Semantic actions. A key, a menu, an agent and an event binding all name the
# same action. An action never embeds an opaque shell command.

[action."desktop.application.ensure"]
label       = "Open or focus an application"
category    = "Applications"
args        = { role = "role name" }
mutating    = true
consequence = "adjust"
# ensure, not open and not focus: those disagree exactly when the application is
# not running. The proposal states which branch it will take.

# Deliberately has NO key binding. The registries are separate objects, so an
# action must be fully usable by an agent while absent from the key surface. If
# it cannot exist without a chord, the separation is nominal.
[action."desktop.window.list"]
label       = "List open windows"
category    = "Desktop"
args        = { role = "optional role name" }
mutating    = false
consequence = "observe"
