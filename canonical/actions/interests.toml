# Interests: things the human wants to hear about (canonical/interests/).
#
# Fetching is split by trust. Both fetch actions share one implementation and
# each fetches only the sources whose channels it declares: interests.fetch holds
# the net: channels, interests.mail holds mail:read, and cap refuses any action
# that would hold both. `cap check` reports an interest whose sources need a
# channel no fetch action declares.

[action."interests.fetch"]
implementation = "interests.fetch"
label       = "Fetch network sources of every interest; alert on anything new"
category    = "Interests"
mutating    = false
consequence = "report"
channels    = ["net:huggingface.co", "notify", "inbox"]

[action."interests.mail"]
implementation = "interests.fetch"
label       = "Fetch mail sources of every interest (read-only); alert on anything new"
category    = "Interests"
mutating    = false
consequence = "report"
channels    = ["mail:read", "notify", "inbox"]

# Reads only the local stores the fetch actions filled; no net: channel, so
# whatever a newsletter says, nothing leaves the machine.
[action."interests.digest"]
implementation = "interests.digest"
label       = "Write one catch-up note per digest interest with the local model, and say so"
category    = "Interests"
mutating    = false
consequence = "report"
channels    = ["model:local", "inbox", "notify"]

# Installed package versions (machine-state-6ko). Local only: what is installed
# says what is vulnerable, so this action holds no net: channel and cap refuses
# one that would hold both.
[action."interests.packages"]
implementation = "interests.fetch"
label       = "Check installed package versions against interests (local only); alert on a match"
category    = "Interests"
mutating    = false
consequence = "report"
channels    = ["packages:read", "notify", "inbox"]
